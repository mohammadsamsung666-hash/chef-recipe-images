<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت سرآشپز</title><link rel="stylesheet" href="../assets/site.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="loginView" class="loginbox"><h1>🔐 پنل مدیریت سرآشپز</h1><p class="muted">فقط حساب‌هایی که در Secret ادمین‌ها تعریف شده‌اند اجازه ورود دارند.</p><label>ایمیل مدیر</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn" style="width:100%">ورود مدیر</button><p id="loginMsg" class="small muted"></p><p class="small"><a href="../index.html">← بازگشت به سایت</a></p></div>
<div id="appView" class="admin-shell hidden">
<aside class="sidebar"><h2>🍴 سرآشپز</h2><div id="adminEmail" class="small" style="color:#aaa;margin-bottom:16px"></div><button class="sidebtn active" data-view="dashboard">داشبورد</button><button class="sidebtn" data-view="users">کاربران</button><button class="sidebtn" data-view="posts">پست‌ها</button><button class="sidebtn" data-view="comments">کامنت‌ها</button><button class="sidebtn" data-view="cook_photos">منم پختم</button><button class="sidebtn" data-view="premium">Premium</button><hr style="border-color:#4a403b"><button id="logoutBtn" class="sidebtn">خروج</button><a class="sidebtn" href="../index.html">مشاهده سایت</a></aside>
<main class="admin-main"><div class="toolbar"><div><h1 id="viewTitle" style="margin:0">داشبورد</h1><div id="status" class="small muted"></div></div><button id="refreshBtn" class="btn secondary">↻ تازه‌سازی</button></div><div id="content"></div></main></div>
<script src="admin.js"></script></body></html>
